<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارگاه کد | سینا صالحی امیری</title>
<meta name="description" content="کارگاه کد: ابزارها و پروژه‌های وب سینا صالحی امیری">
<meta name="theme-color" content="#080B1A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2.5 34.5 10.8v18.4L20 37.5 5.5 29.2V10.8z' fill='%238F7CFF'/%3E%3Cpath d='M16 15.5 11 20l5 4.5M24 15.5 29 20l-5 4.5' fill='none' stroke='%230A0D1C' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080B1A; --ink:#EEF0FF; --muted:#A9B0DC;
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --edge:rgba(255,255,255,.22);
  --accent:#8F7CFF; --accent2:#5EE6C8; --pink:#FF7AC6;
  --font:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#EBEEFB;--ink:#141A40;--muted:#4B5384;--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--edge:rgba(99,102,190,.28);--accent:#6D5BFF;--accent2:#0A8F77;--h1a:#141A40;--inset:rgba(255,255,255,.9);color-scheme:light}
:root[data-theme="light"] .orbs i{opacity:.35}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.9;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:10px}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px;position:relative}

/* floating light orbs behind the glass */
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;opacity:.7}
.orbs i:nth-child(1){width:640px;height:640px;background:radial-gradient(circle,var(--accent) 0,transparent 68%);top:-260px;right:-200px}
.orbs i:nth-child(2){width:560px;height:560px;background:radial-gradient(circle,var(--accent2) 0,transparent 68%);top:40%;left:-260px;opacity:.45}
.orbs i:nth-child(3){width:520px;height:520px;background:radial-gradient(circle,var(--pink) 0,transparent 68%);bottom:-240px;right:12%;opacity:.4}


.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6),inset 0 1px 0 var(--inset,rgba(255,255,255,.28))}

/* top bar */
.bar{position:sticky;top:10px;z-index:10;margin:10px auto 0;max-width:1000px;padding:0 22px}
.bar .glass{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 8px 20px;border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none;font-size:18px;white-space:nowrap}
.mark{width:38px;height:38px;flex:none;filter:drop-shadow(0 6px 10px rgba(143,124,255,.5))}
.bar nav{display:flex;gap:4px}
.bar nav a{text-decoration:none;color:var(--muted);padding:5px 14px;border-radius:999px;font-weight:500}
.bar nav a:hover{background:var(--glass2);color:var(--ink)}
.theme{font:inherit;background:var(--glass2);border:1px solid var(--edge);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;margin-inline-start:6px}
.theme:hover{border-color:var(--accent2)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;padding:60px 0 10px}
.hero .glass{padding:40px 38px}
.hero h1{margin:0 0 14px;font-weight:900;font-size:clamp(38px,7vw,68px);line-height:1.3;
  background:linear-gradient(100deg,var(--h1a,#fff) 30%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 24px;font-size:19px;color:var(--muted);max-width:30em}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;text-decoration:none;border-radius:14px;padding:9px 24px;border:1px solid var(--edge);background:var(--glass2);cursor:pointer;color:var(--ink)}
.btn.main{background:linear-gradient(135deg,var(--accent),#6D5BFF);border-color:transparent}
.btn:hover{filter:brightness(1.15)}

/* 3D cube */
.stage{perspective:900px;display:grid;place-items:center;height:300px}
.cube{--s:150px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;will-change:transform;animation:spin 22s linear infinite}
.cube div{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:28px;direction:ltr;
  background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.04));border:1px solid var(--edge);border-radius:18px;
  box-shadow:inset 0 0 30px rgba(143,124,255,.35)}
.cube div:nth-child(1){transform:translateZ(75px)}
.cube div:nth-child(2){transform:rotateY(90deg) translateZ(75px)}
.cube div:nth-child(3){transform:rotateY(180deg) translateZ(75px)}
.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(75px)}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(75px)}
.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(75px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}

section{padding:78px 0 0}
.statbar{display:grid;grid-template-columns:repeat(3,1fr);margin-top:36px;padding:8px 0;border-radius:22px}
.stat{padding:14px 12px;text-align:center;border-inline-start:1px solid var(--edge)}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-size:34px;font-weight:900;line-height:1.3;background:linear-gradient(100deg,var(--ink),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:14px}
.about{padding:30px;max-width:46em}
.about p{margin:0;font-size:18px}
h2{font-size:34px;font-weight:900;margin:0 0 26px;line-height:1.4}

/* tilt cards */
.tilt{transition:transform .18s ease-out,border-color .2s}
.grid{display:grid;gap:20px;margin:0;padding:0;list-style:none}
.grid.skills{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.grid.projects{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.group{padding:26px}
.group h3{margin:0 0 14px;font-size:18px;font-weight:800;color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.chips li{background:var(--glass2);border:1px solid var(--edge);border-radius:12px;padding:2px 16px;font-weight:500;transform:translateZ(20px)}
.card{display:flex;flex-direction:column;height:100%;padding:26px;text-decoration:none}
a.card:hover{border-color:var(--accent2)}
.card h3{margin:0 0 6px;font-size:22px;font-weight:800;transform:translateZ(28px)}
.card p{margin:0 0 18px;color:var(--muted);flex:1;transform:translateZ(14px)}
.card .go{font-weight:700;color:var(--accent2);transform:translateZ(24px)}
.cover{height:150px;border-radius:14px;margin-bottom:18px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--edge);background:var(--glass2);transform:translateZ(18px);box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.bw{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--edge);direction:ltr}
.bw i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.55}
.bw span{margin-inline-start:8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{flex:1;display:grid;place-items:center;position:relative;overflow:hidden}
.cb img{width:100%;height:100%;object-fit:cover}
.ic{font-size:50px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.tech{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tech span{font-size:13px;border:1px solid var(--edge);border-radius:8px;padding:0 10px;background:var(--glass2);direction:ltr}
li{list-style:none}

/* contact */
.contact{display:grid;gap:16px;max-width:640px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 24px;border-radius:20px}
.crow .label{display:block;color:var(--muted);font-size:14px;line-height:1.6}
.crow .val{font-size:24px;font-weight:800;text-decoration:none;word-break:break-all}
.crow .val:hover{color:var(--accent2)}
button.copy{font:inherit;font-weight:700;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);border-radius:12px;padding:6px 20px;cursor:pointer}
button.copy:hover{background:var(--accent);border-color:transparent}
button.copy[data-done="1"]{background:var(--accent2);color:#08102A;border-color:transparent}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.links a{text-decoration:none;padding:6px 20px;border-radius:14px;font-weight:700}
.links a:hover{border-color:var(--accent2)}
footer{padding:70px 0 48px;color:var(--muted);font-size:14px;text-align:center}

@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:36px}.stage{height:240px;order:-1}.cube{--s:120px}
 .cube div:nth-child(1){transform:translateZ(60px)}.cube div:nth-child(2){transform:rotateY(90deg) translateZ(60px)}
 .cube div:nth-child(3){transform:rotateY(180deg) translateZ(60px)}.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
 .cube div:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
 .hero .glass{padding:28px 22px}.bar nav a{padding:5px 9px}}
@media(max-width:760px){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass2)}.bar .glass,.hero>.glass{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}}
@media(max-width:560px){.wrap{padding:0 16px}.bar{padding:0 12px}section{padding-top:56px}h2{font-size:28px}.hero p{font-size:17px}.btn{flex:1;text-align:center}.stat{padding:10px 4px}.stat b{font-size:24px}.stat span{font-size:12px}.crow{padding:16px}.crow .val{font-size:19px}.group,.card,.about{padding:20px}}
@media(max-width:480px){#logoText{display:none}.bar .glass{padding:8px 10px}.bar nav a{padding:5px 7px;font-size:15px}}
@media(max-width:340px){.stat span{font-size:11px}.hero h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){.cube,.orbs i,.ic{animation:none}.cube{transform:rotateX(-22deg) rotateY(35deg)}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="bar"><div class="glass">
  <a class="logo" href="#top"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F7CFF"/><stop offset="1" stop-color="#5EE6C8"/></linearGradient></defs><path d="M20 2.5 34.5 10.8v18.4L20 37.5 5.5 29.2V10.8z" fill="url(#lg)"/><path d="M20 2.5 34.5 10.8 20 19 5.5 10.8z" fill="#fff" opacity=".28"/><path d="M16 15.5 11 20l5 4.5M24 15.5 29 20l-5 4.5M21.5 14 18.5 26" fill="none" stroke="#0A0D1C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="logoText">سایت من</span></a>
  <nav aria-label="بخش‌های صفحه">
    <a href="#skills">مهارت‌ها</a>
    <a href="#projects">پروژه‌ها</a>
    <a href="#contact">تماس</a>
    <button class="theme" id="theme" type="button" aria-label="تغییر حالت تیره و روشن">☀</button>
  </nav>
</div></div>

<main class="wrap" id="top">
  <header class="hero">
    <div class="glass">
      <h1 id="name">سینا</h1>
      <p id="bio"></p>
      <div class="btns">
        <a class="btn main" href="#projects">دیدن پروژه‌ها</a>
        <a class="btn" href="#contact">تماس با من</a>
      </div>
    </div>
    <div class="stage" aria-hidden="true">
      <div class="cube"><div>HTML</div><div>CSS</div><div>JS</div><div>C#</div><div>Py</div><div>BE</div></div>
    </div>
  </header>

  <div class="statbar glass" id="stats"></div>

  <section id="about">
    <h2>درباره من</h2>
    <div class="glass about tilt"><p id="aboutText"></p></div>
  </section>

  <section id="skills">
    <h2>مهارت‌ها</h2>
    <div class="grid skills" id="skillGroups"></div>
  </section>

  <section id="projects">
    <h2>پروژه‌ها</h2>
    <ul class="grid projects" id="projectList"></ul>
  </section>

  <section id="contact">
    <h2>تماس با من</h2>
    <div class="contact" id="contactList"></div>
    <div class="links" id="extraLinks"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const BASE = "https://sinasalehiamiri4-rgb.github.io/";
const DATA = {
  brand: "کارگاه کد",
  name: "سینا صالحی امیری",
  bio: "برنامه‌نویسی که ابزارهای کاربردی می‌سازد: از قیمت لحظه‌ای بازار تا مدیریت چک و هزینه‌ها.",
  about: "من سینا هستم و دوست دارم ابزارهایی بسازم که در کارهای روزمره به درد بخورند؛ از ردیابی فیلم‌ها و هزینه‌ها تا ابزار فیلمبرداری. با Python، C# و جاوااسکریپت کار می‌کنم و پروژه‌هایم را آنلاین منتشر کرده‌ام تا هر کسی بتواند از آن‌ها استفاده کند.",
  skills: [
    { title: "بک‌اند", items: ["بک‌اند", "C#", "Python"] },
    { title: "فرانت‌اند", items: ["HTML", "CSS", "JavaScript"] }
  ],
  projects: [
    { title: "ردیاب فیلم", desc: "برای مدیریت و ثبت فیلم‌هایی که دیده‌ام و می‌خواهم ببینم.", url: BASE + "tracker/" },
    { title: "مدیریت چک و حواله", desc: "ثبت و پیگیری چک‌ها و حواله‌ها در یک جا.", url: BASE + "check-manager/" },
    { title: "سایت فوتبال", desc: "یک سایت برای طرفداران فوتبال.", url: BASE + "LFC/" },
    { title: "قیمت لحظه‌ای بازار", desc: "نمایش قیمت‌های بازار به‌صورت لحظه‌ای.", url: BASE + "bazar/" },
    { title: "تله‌پرامپتر", desc: "متن را روی صفحه نمایش می‌دهد تا هنگام فیلمبرداری از روی آن بخوانید.", url: BASE + "teleprompter/" },
    { title: "مدیریت هزینه‌ها", desc: "ثبت خرج‌ها و نگه‌داشتن حساب هزینه‌های روزمره.", url: BASE + "finance/" }
  ],
  phone: "09360641328",
  email: "",
  telegram: "",
  whatsapp: "",
  links: [["GitHub", "https://github.com/sinasalehiamiri4-rgb"]]
};

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const fa = s => s.replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

document.title = DATA.brand + " | " + DATA.name;
$("name").textContent = DATA.name;
$("bio").textContent = DATA.bio;
$("logoText").textContent = DATA.brand;
$("foot").textContent = "© " + fa(String(new Date().getFullYear())) + " " + DATA.name;

DATA.skills.forEach(g => {
  const box = el("div", "group glass tilt");
  box.appendChild(el("h3", null, g.title));
  const ul = el("ul", "chips");
  g.items.forEach(n => ul.appendChild(el("li", null, n)));
  box.appendChild(ul);
  $("skillGroups").appendChild(box);
});

const ICONS = ["🎬", "🧾", "⚽", "📈", "🎥", "💰"];
DATA.projects.forEach((p, i) => {
  const li = el("li");
  const card = el("a", "card glass tilt");
  card.href = p.url; card.target = "_blank"; card.rel = "noopener";
  const cover = el("div", "cover");
  const h = (i * 57 + 250) % 360;
  const bar = el("div", "bw");
  for (let k = 0; k < 3; k++) bar.appendChild(el("i"));
  bar.appendChild(el("span", null, p.url.replace("https://", "").replace(/\/$/, "")));
  const cb = el("div", "cb");
  cb.style.background = "radial-gradient(circle at 70% 20%,hsla(" + ((h + 60) % 360) + ",90%,65%,.55),transparent 60%),linear-gradient(135deg,hsla(" + h + ",85%,55%,.6),hsla(" + ((h + 40) % 360) + ",80%,35%,.35))";
  if (p.image) { const im = el("img"); im.src = p.image; im.alt = p.title; cb.appendChild(im); }
  else cb.appendChild(el("span", "ic", ICONS[i % ICONS.length]));
  cover.appendChild(bar); cover.appendChild(cb);
  card.appendChild(cover);
  card.appendChild(el("h3", null, p.title));
  card.appendChild(el("p", null, p.desc));
  const tc = el("div", "tech");
  (p.tech || ["HTML", "CSS", "JavaScript"]).forEach(x => tc.appendChild(el("span", null, x)));
  card.appendChild(tc);
  card.appendChild(el("span", "go", "مشاهده پروژه"));
  li.appendChild(card);
  $("projectList").appendChild(li);
});

function contactRow(label, shown, copyValue, href) {
  const r = el("div", "crow glass");
  const left = el("div");
  left.appendChild(el("span", "label", label));
  const v = el("a", "val", shown); v.href = href;
  left.appendChild(v); r.appendChild(left);
  const b = el("button", "copy", "کپی"); b.type = "button";
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(copyValue); b.textContent = "کپی شد"; b.dataset.done = "1"; }
    catch (e) { b.textContent = "کپی نشد"; }
    setTimeout(() => { b.textContent = "کپی"; delete b.dataset.done; }, 1800);
  });
  r.appendChild(b);
  $("contactList").appendChild(r);
}
contactRow("شماره تماس", fa(DATA.phone), DATA.phone, "tel:" + DATA.phone);
if (DATA.email) contactRow("ایمیل", DATA.email, DATA.email, "mailto:" + DATA.email);

if (DATA.telegram) DATA.links.push(["تلگرام", "https://t.me/" + DATA.telegram.replace(/^@/, "")]);
if (DATA.whatsapp) DATA.links.push(["واتساپ", "https://wa.me/" + DATA.whatsapp]);
DATA.links.forEach(([n, u]) => {
  const a = el("a", "glass", n); a.href = u; a.target = "_blank"; a.rel = "noopener";
  $("extraLinks").appendChild(a);
});

$("aboutText").textContent = DATA.about;
[[DATA.projects.length, "پروژه آنلاین"], [DATA.skills.reduce((n, g) => n + g.items.length, 0), "مهارت"], [3, "زبان برنامه‌نویسی"]].forEach(([n, l]) => {
  const s = el("div", "stat");
  s.appendChild(el("b", null, fa(String(n))));
  s.appendChild(el("span", null, l));
  $("stats").appendChild(s);
});

/* pause the cube when it is off screen */
const cube = document.querySelector(".cube");
if ("IntersectionObserver" in window && cube) new IntersectionObserver(es => { cube.style.animationPlayState = es[0].isIntersecting ? "running" : "paused"; }).observe(cube.parentElement);

/* dark / light switch */
const root = document.documentElement, tb = $("theme");
function setTheme(t) { root.dataset.theme = t; tb.textContent = t === "light" ? "☾" : "☀"; }
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved === "light" ? "light" : "dark");
tb.addEventListener("click", () => {
  const t = root.dataset.theme === "light" ? "dark" : "light";
  setTheme(t);
  try { localStorage.setItem("theme", t); } catch (e) {}
});

/* 3D tilt that follows the pointer */
if (matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches) {
  document.querySelectorAll(".tilt").forEach(c => {
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      if (!c._raf) c._raf = requestAnimationFrame(() => { c._raf = 0; c.style.transform = "perspective(800px) rotateX(" + (-y * 12) + "deg) rotateY(" + (x * 12) + "deg)"; });
    });
    c.addEventListener("pointerleave", () => { c.style.transform = ""; });
  });
}
</script>
</body>
</html>
